{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}HelpDesk{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'tickets/css/style.css' %}">
</head>

<body>

<header class="navbar">
    <div class="container navbar-content">

        <a href="{% url 'ticket_list' %}" class="logo">
            HelpDesk
        </a>

        <nav>
            <a href="{% url 'ticket_list' %}">
                Tickets
            </a>

            {% if user.is_authenticated %}

                <span>{{ user.username }}</span>

                <form method="post"
                      action="{% url 'logout' %}"
                      class="inline-form">

                    {% csrf_token %}

                    <button type="submit" class="link-button">
                        Logout
                    </button>

                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

            {% endif %}
        </nav>

    </div>
</header>


<main class="container">

    {% if messages %}

        {% for message in messages %}

            <div class="message {{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    {% block content %}
    {% endblock %}

</main>

</body>
</html>
